name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refreshes Security Watch's news and CISA list every 3 hours.
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons shared src petty-cash sushiro calc84 wallets bazi fengshui learnai godigital chat split trip security ziwei _site/
      - name: Collect security news and CISA's exploited list
        run: node tools/build-feeds.js _site/security/data.json
        env:
          # Optional: a free key from nvd.nist.gov lets the NVD be read 10× faster.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
